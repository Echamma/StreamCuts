name: Phase 3 regression

on:
  pull_request:
    paths:
      - ".github/workflows/phase3-regression.yml"
      - "opencut-classic/**"
      - "e2e/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-regression.yml"
      - "opencut-classic/**"
      - "e2e/**"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: opencut-classic
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Test color and scope Rust crates
        run: cargo test --locked -p color-grade -p scopes

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build the combined WASM package
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg --no-opt

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Install locked web dependencies
        run: bun install --frozen-lockfile

      - name: Test HSL curves and audio dynamics
        working-directory: opencut-classic/apps/web
        run: bun test src/effects/__tests__/hsl-curves.test.ts src/media/__tests__/audio-dynamics.test.ts

      # Each test binds a separate WASM instance to the generated glue module.
      - name: Test WASM scope exports
        working-directory: opencut-classic/apps/web
        run: bun test src/scopes/__tests__/scope-wasm.test.ts
