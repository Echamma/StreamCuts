[package]
name = "streamcuts"
description = "StreamCuts, native: edit videos and cut clips"
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[[bin]]
name = "streamcuts"
path = "src/main.rs"

[dependencies]
canopy-ui = { path = "../../canopy/native/crates/canopy-ui" }
cpal = "0.18.2"
egui = "0.37.0"
image = "0.25.10"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]
opt-level = 2

# Release builds: drop debug symbols and let the linker see across crates, which roughly halves the exe.
[profile.release]
strip = true
lto = "thin"
